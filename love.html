<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Please say Yes! 🥺</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Fredoka:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Fredoka', 'Patrick Hand', sans-serif;
            overflow: hidden;
            background-color: #ffe5ec;
            background-image: 
                radial-gradient(#ffb3c6 15%, transparent 16%), 
                radial-gradient(#ffb3c6 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            /* Disable text selection and touch highlights for mobile app feel */
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
            touch-action: manipulation;
        }

        .sparkle {
            position: absolute;
            pointer-events: none;
            animation: sparkle-anim 1s linear forwards;
            z-index: 9999;
        }
        @keyframes sparkle-anim {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0) rotate(180deg); opacity: 0; top: 50px; }
        }

        .heart {
            position: absolute;
            color: #ff4d6d;
            animation: fall linear forwards;
            z-index: 0;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(720deg); }
        }
        
        #no-btn { 
            transition: transform 0.2s ease; 
            position: relative; /* Change to relative within container initially */
        }

        .float-bubble { animation: float 3s ease-in-out infinite; }
        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(6deg); }
            50% { transform: translateY(-10px) rotate(6deg); }
        }

        .heartbeat { animation: heartbeat 1.5s infinite; }
        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.1); }
            28% { transform: scale(1); }
            42% { transform: scale(1.1); }
            70% { transform: scale(1); }
        }
    </style>
</head>
<body class="h-screen w-screen flex flex-col items-center justify-center relative overflow-hidden" 
      ontouchmove="createSparkle(event)" 
      onmousemove="createSparkle(event)">

    <!-- Main Card -->
    <div id="main-card" class="bg-white/90 backdrop-blur-sm p-6 md:p-8 rounded-[2rem] shadow-[0_10px_30px_rgba(255,100,150,0.3)] text-center w-11/12 max-w-md mx-auto border-4 border-pink-200 z-10 transition-all duration-300 relative">
        
        <!-- Decoration -->
        <div class="absolute -top-4 -right-2 text-4xl md:text-5xl animate-bounce" style="animation-duration: 2s;">💌</div>
        <div class="absolute -bottom-4 -left-2 text-4xl md:text-5xl animate-bounce" style="animation-duration: 2.5s; animation-delay: 0.5s;">🧸</div>

        <!-- Image Area -->
        <div class="mb-4 relative h-40 md:h-52 w-full flex items-center justify-center mt-4">
            <!-- Speech Bubble -->
            <div class="absolute -top-10 right-4 bg-white px-3 py-2 md:px-5 md:py-3 rounded-2xl border-2 border-pink-300 shadow-md float-bubble z-20">
                <span class="text-pink-500 font-bold text-sm md:text-lg">I have a crush on u! 👉👈</span>
                <div class="absolute bottom-[-8px] left-4 w-4 h-4 bg-white border-b-2 border-r-2 border-pink-300 transform rotate-45"></div>
            </div>

            <img id="gif-image" 
                 src="https://media.tenor.com/nJ33C1aE3KwAAAAi/cute-love.gif" 
                 alt="Confession Bear" 
                 class="h-full object-contain rounded-xl drop-shadow-md"
            >
        </div>

        <!-- Question -->
        <h1 class="text-3xl md:text-4xl font-extrabold text-pink-500 mb-6 leading-relaxed drop-shadow-sm">
            Do you love me? 💖
        </h1>

        <!-- Buttons Container -->
        <div class="flex flex-col items-center gap-3 relative w-full h-40 justify-start">
            <!-- Yes Button -->
            <button id="yes-btn" onclick="acceptLove()" class="heartbeat px-8 py-3 bg-gradient-to-r from-pink-400 to-pink-500 text-white font-bold rounded-full text-xl md:text-2xl shadow-[0_4px_0_rgb(190,24,93)] active:shadow-none active:translate-y-[4px] transition-all duration-300 transform z-20 w-auto min-w-[140px] border-2 border-white tap-highlight-transparent">
                Yes 💖
            </button>

            <!-- No Button -->
            <button id="no-btn" 
                    onmouseenter="handleNoInteraction()" 
                    ontouchstart="handleNoInteraction(event)"
                    class="px-6 py-2 bg-gray-300 text-gray-600 font-bold rounded-full text-lg shadow-md z-10 opacity-80 select-none tap-highlight-transparent">
                No 💔
            </button>
        </div>
    </div>

    <!-- Success Message -->
    <div id="success-msg" class="hidden flex-col items-center justify-center z-50 animate-bounce p-4 w-full h-full absolute top-0 left-0 bg-white/80 backdrop-blur-sm">
        <h1 class="text-5xl md:text-7xl font-bold text-pink-600 mb-4 drop-shadow-lg font-['Patrick_Hand']">YAYYY! 🎉</h1>
        <p class="text-2xl md:text-3xl text-pink-500 font-bold mb-6 text-center">I knew it! Love you! 🥰</p>
        <img src="https://media.tenor.com/gUiu1zyxfzYAAAAi/bear-kiss-bear-kisses.gif" alt="Kiss" class="mx-auto rounded-[2rem] border-8 border-white shadow-2xl w-64 md:w-80 mb-8">
        <button onclick="location.reload()" class="px-8 py-3 bg-white text-pink-500 font-bold rounded-full hover:bg-pink-50 transition shadow-lg border-2 border-pink-200">
            Play Again 🔄
        </button>
    </div>

    <script>
        const noBtn = document.getElementById('no-btn');
        const yesBtn = document.getElementById('yes-btn');
        const mainCard = document.getElementById('main-card');
        const successMsg = document.getElementById('success-msg');
        const gifImage = document.getElementById('gif-image');
        
        let yesScale = 1;
        const happyGif = "https://media.tenor.com/nJ33C1aE3KwAAAAi/cute-love.gif"; 
        const sadGifs = [
            "https://media.tenor.com/1-B4BzkD8bEAAAAi/mochi-cat.gif", 
            "https://media.tenor.com/P40pX2d1uXMAAAAi/mochi-peach.gif", 
            "https://media.tenor.com/0P6FzIZ2W8QAAAAi/milk-and-mocha-bear.gif" 
        ];
        const funnyTexts = ["No!", "Really?", "Think again!", "Please 🥺", "Don't! 💔", "Why?"];

        // Sparkle Effect
        function createSparkle(e) {
            // Rate limit sparkles for performance on mobile
            if (Math.random() > 0.3) return;

            const sparkle = document.createElement('div');
            sparkle.classList.add('sparkle');
            sparkle.innerText = ['✨', '💖', '🌸'][Math.floor(Math.random() * 3)];
            
            let clientX, clientY;
            if (e.type === 'touchmove') {
                clientX = e.touches[0].clientX;
                clientY = e.touches[0].clientY;
            } else {
                clientX = e.clientX;
                clientY = e.clientY;
            }
            
            sparkle.style.left = clientX + 'px';
            sparkle.style.top = clientY + 'px';
            sparkle.style.fontSize = Math.random() * 15 + 10 + 'px';
            sparkle.style.color = ['#ff4d6d', '#ffb3c6', '#ffd700'][Math.floor(Math.random() * 3)];
            
            document.body.appendChild(sparkle);
            setTimeout(() => sparkle.remove(), 1000);
        }

        function handleNoInteraction(e) {
            if (e) e.preventDefault(); // Stop click on touch devices
            moveButtonNearby();
            makeYesBigger();
            changeImageToSad();
            changeNoText();
        }

        function moveButtonNearby() {
            // Smaller range for mobile to ensure it stays on screen
            const randomX = (Math.random() - 0.5) * 120; 
            const randomY = (Math.random() - 0.5) * 120; 
            
            noBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
        }

        function changeNoText() {
            noBtn.innerText = funnyTexts[Math.floor(Math.random() * funnyTexts.length)];
        }

        function makeYesBigger() {
            if (yesScale < 2.0) { // Cap size for mobile
                yesScale += 0.1; 
                yesBtn.style.transform = `scale(${yesScale})`;
            }
        }

        function changeImageToSad() {
            const randomSad = sadGifs[Math.floor(Math.random() * sadGifs.length)];
            gifImage.src = randomSad;
        }

        function acceptLove() {
            confetti({
                particleCount: 150,
                spread: 70,
                origin: { y: 0.6 },
                colors: ['#ff4d6d', '#ffb3c6', '#ffffff']
            });

            setTimeout(() => confetti({ particleCount: 100, spread: 100, origin: { y: 0.7 } }), 300);

            createHearts();
            // Hide card smoothly
            mainCard.style.opacity = '0';
            setTimeout(() => {
                mainCard.style.display = 'none';
                successMsg.classList.remove('hidden');
                successMsg.classList.add('flex');
            }, 300);
            
            document.body.style.backgroundImage = "none";
            document.body.classList.remove('bg-pink-100');
            document.body.classList.add('bg-pink-50');

            setInterval(createHearts, 200);
        }

        function createHearts() {
            const heart = document.createElement('div');
            heart.classList.add('heart');
            heart.innerHTML = ['❤️', '💖', '💝', '💕', '🥰'][Math.floor(Math.random() * 5)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = Math.random() * 2 + 3 + 's';
            heart.style.fontSize = Math.random() * 20 + 20 + 'px';
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 5000);
        }
    </script>
</body>
</html>
